<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Catch List</title>
<style>
:root{
  --paper:#EDEFE8; --card:#FFFFFF; --ink:#17231C; --muted:#6E7A70; --line:#D7DCD2;
  --catch:#0F7A4A; --maybe:#B8620F; --depth:#5A6B7D; --chrome:#3B2C6B;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 64px}

header{position:sticky;top:0;z-index:10;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
  border-bottom:1px solid var(--line);margin:0 -14px 14px}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.stamp{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}

.search{position:relative}
input[type=search]{width:100%;font-family:var(--sans);font-size:17px;font-weight:600;
  padding:13px 40px 13px 14px;border:2px solid var(--ink);border-radius:11px;
  background:var(--card);color:var(--ink);appearance:none}
input[type=search]::-webkit-search-cancel-button{display:none}
input[type=search]:focus{outline:3px solid var(--chrome);outline-offset:1px;border-color:var(--chrome)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  font-size:22px;color:var(--muted);padding:6px 10px;cursor:pointer;display:none}
.clear.on{display:block}

.seg{display:flex;gap:4px;margin-top:10px;background:var(--line);padding:3px;border-radius:10px}
.seg button{flex:1;border:0;background:none;font-family:var(--sans);font-size:13px;font-weight:700;
  padding:9px 4px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--chrome);
  box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:3px solid var(--chrome);outline-offset:-1px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  font-family:var(--sans);font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.chip[data-tier=core][aria-pressed=true]{border-color:var(--catch);color:var(--catch)}
.chip[data-tier=flex][aria-pressed=true]{border-color:var(--maybe);color:var(--maybe)}
.chip[data-tier=niche][aria-pressed=true]{border-color:var(--depth);color:var(--depth)}
.chip:focus-visible{outline:3px solid var(--chrome);outline-offset:2px}

.count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;margin:2px 0 10px}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px 12px 18px;margin-bottom:8px;overflow:hidden;cursor:pointer}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.card[data-tier=core]::before{background:var(--catch)}
.card[data-tier=flex]::before{background:var(--maybe)}
.card[data-tier=niche]::before{background:var(--depth)}
.card:focus-visible{outline:3px solid var(--chrome);outline-offset:2px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-size:19px;font-weight:800;letter-spacing:-.02em}
.verdict{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.card[data-tier=core] .verdict{color:var(--catch)}
.card[data-tier=flex] .verdict{color:var(--maybe)}
.card[data-tier=niche] .verdict{color:var(--depth)}

.chain{font-size:14px;color:var(--muted);margin-top:2px}
.chain b{color:var(--ink);font-weight:600}
.chain .arrow{color:var(--line);padding:0 5px;font-weight:700}

.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--paper);color:var(--muted)}
.tag.role{background:#E6EFE9;color:var(--catch)}
.tag.xl{background:#FBE9DA;color:var(--maybe)}
.tag.shadowonly{background:#EAE5F5;color:var(--chrome)}
.tag.raid{background:#E7EAF0;color:var(--depth)}
.tag.lure{background:#E3EEF4;color:#0B5A78}
.tag.lureevo{background:#0B5A78;color:#fff}
.now{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:6px;
  margin-bottom:7px}
.now.wild{background:var(--ink);color:#fff}
.now.raid,.now.egg{background:var(--card);color:var(--depth);box-shadow:inset 0 0 0 1.5px var(--line)}
.now .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip[data-live][aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}

.ranks{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.card.open .ranks{display:grid}
.rank{text-align:center}
.rank .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.rank .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:1px}
.rank.hit .v{color:var(--catch)}
.rank .v.none{color:var(--line)}
.detail{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.45}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;font-size:17px;color:var(--ink);font-weight:700;margin-bottom:5px}
mark{background:#FBEFAA;color:inherit;border-radius:2px;padding:0 1px}

footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.55}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .12s ease}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="masthead"><h1>Catch List</h1><span class="stamp" id="stamp"></span></div>
  <div class="search">
    <input type="search" id="q" placeholder="Type a Pokémon name" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Search Pokémon">
    <button class="clear" id="clear" aria-label="Clear search">&times;</button>
  </div>
  <div class="seg" id="leagues" role="group" aria-label="League"></div>
  <div class="chips" id="filters"></div>
</header>
<div class="count" id="count"></div>
<div id="list"></div>
<footer id="foot"></footer>
</div>
<script>
const DATA = __DATA__;
const VERDICT = {core:"Catch it", flex:"Worth a ball", niche:"Only if you want it"};
const state = {league:"great", q:"", live:false,
  tiers:new Set(["core","flex"]), sections:new Set(["wild","raid"])};
const $ = id => document.getElementById(id);

document.title = "Catch List";
$("stamp").textContent = "PvPoke " + DATA.gamemaster.slice(0,10);

$("leagues").innerHTML = Object.entries(DATA.leagues).map(([k,v]) =>
  `<button data-lg="${k}" aria-pressed="${k===state.league}">${v.label.replace(" League","")}</button>`).join("");
$("leagues").onclick = e => { const b = e.target.closest("button"); if(!b) return;
  state.league = b.dataset.lg; sync(); };

$("filters").innerHTML =
  [["core","Core"],["flex","Flex"],["niche","Deep"]].map(([t,l]) =>
    `<button class="chip" data-kind="tier" data-tier="${t}" aria-pressed="${state.tiers.has(t)}">${l}</button>`).join("") +
  [["wild","Wild"],["raid","Raid &amp; egg"]].map(([s,l]) =>
    `<button class="chip" data-kind="section" data-section="${s}" aria-pressed="true">${l}</button>`).join("") +
  `<button class="chip" data-kind="live" data-live="1" aria-pressed="false">Live now</button>`;
$("filters").onclick = e => { const b = e.target.closest(".chip"); if(!b) return;
  if(b.dataset.kind === "live"){ state.live = !state.live;
    b.setAttribute("aria-pressed", state.live); sync(); return; }
  const set = b.dataset.kind === "tier" ? state.tiers : state.sections;
  const key = b.dataset.tier || b.dataset.section;
  set.has(key) ? set.delete(key) : set.add(key);
  b.setAttribute("aria-pressed", set.has(key)); sync(); };

$("q").oninput = e => { state.q = e.target.value.trim().toLowerCase();
  $("clear").classList.toggle("on", !!state.q); sync(); };
$("clear").onclick = () => { $("q").value = ""; state.q = "";
  $("clear").classList.remove("on"); $("q").focus(); sync(); };

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(s){ if(!state.q) return esc(s);
  const i = s.toLowerCase().indexOf(state.q); if(i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+state.q.length)) + "</mark>" + esc(s.slice(i+state.q.length)); }

function sync(){
  document.querySelectorAll("#leagues button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lg === state.league));
  const lg = DATA.leagues[state.league];
  let rows = lg.rows.filter(r => state.tiers.has(r.tier) && state.sections.has(r.section));
  if(state.live) rows = rows.filter(r => r.now);
  if(state.q) rows = rows.filter(r =>
    r.target.toLowerCase().includes(state.q) ||
    r.becomes.some(b => b.toLowerCase().includes(state.q)) ||
    (r.lures || []).some(l => l.toLowerCase().includes(state.q)) ||
    (r.aliases || []).some(a => a.toLowerCase().includes(state.q)));

  $("count").textContent = rows.length + (rows.length === 1 ? " target" : " targets") +
    " \u00b7 " + lg.label;

  $("list").innerHTML = rows.length ? rows.map(r => {
    const shown = [r.target].concat(r.becomes).map(x => x.toLowerCase());
    const via = state.q ? (r.aliases || []).find(a =>
      a.toLowerCase().includes(state.q) && !shown.some(v => v.includes(state.q))) : null;
    const chain = "<b>" + hl(r.target) + "</b>" +
      (r.becomes.length === 1 && r.becomes[0] === r.target ? "" :
       '<span class="arrow">\u203a</span>' + r.becomes.map(hl).join(", "));
    const tags = [`<span class="tag role">${r.bestRole}</span>`];
    if(r.section === "raid") tags.push(`<span class="tag raid">${r.source}</span>`);
    if(r.avail === "Shadow only") tags.push(`<span class="tag shadowonly">Candy only</span>`);
    if(r.xl) tags.push(`<span class="tag xl">XL</span>`);
    if(r.lures && r.lures.length) tags.push(
      `<span class="tag lure">${r.lures.join(" \u00b7 ")} lure</span>`);
    (r.lureEvo || []).forEach(e => tags.push(
      `<span class="tag lureevo">${e.split(" Lure")[0].split(" - ")[0]} lure to evolve</span>`));
    const cell = (k,v) => `<div class="rank ${v && v<=75 ? "hit" : ""}"><div class="k">${k}</div>` +
      `<div class="v ${v ? "" : "none"}">${v ? v : "\u2014"}</div></div>`;
    const now = r.now ? `<div class="now ${r.now.kind}"><span class="dot"></span>${r.now.label}</div>` : "";
    return `<div class="card" data-tier="${r.tier}" tabindex="0" role="button" aria-expanded="false">
      ${now}
      <div class="top"><span class="name">${hl(r.target)}</span>
        <span class="verdict">${VERDICT[r.tier]}</span></div>
      <div class="chain">${chain}${via ? `<span class="arrow">\u203a</span>${hl(via)}` : ""}</div>
      <div class="tagrow">${tags.join("")}</div>
      <div class="ranks">${cell("Overall",r.overall)}${cell("Lead",r.lead)}${cell("Switch",r.switch)}${cell("Closer",r.closer)}</div>
      <div class="detail" hidden>${detail(r)}</div>
    </div>`;
  }).join("") : `<div class="empty"><b>Nothing matches</b>
      Try the wild form or what it evolves into \u2014 both work.
      If <b style="display:inline">Live now</b> is on, turn it off to see everything.</div>`;
}

function detail(r){
  const bits = [];
  if(r.avail === "Shadow only") bits.push("Only the Shadow version is ranked. Catching this in the wild builds candy, but the Pok\u00e9mon you play has to come from a Rocket battle.");
  else if(r.avail === "Both") bits.push("Both the normal and Shadow versions are ranked.");
  (r.lureEvo || []).forEach(e => bits.push(e.includes(" - ") ? e.replace(" - ", ": ") + "." : e + "."));
  if(r.lures && r.lures.length) bits.push(
    `${r.lures.join(" and ")} ${r.lures.length > 1 ? "Lures" : "Lure"} boost its type, out of whatever already spawns in your area.`);
  if(r.now) bits.push(r.now.via
    ? `Available now as ${r.now.via} \u2014 ${r.now.label}.`
    : `Available now \u2014 ${r.now.label}.`);
  if(r.section === "raid") bits.push("Source: " + r.source + ".");
  if(r.xl) bits.push(state.league === "master"
    ? "Master League is uncapped, so XL candy to level 50 is a real power gap."
    : "Needs XL candy \u2014 it can't reach the cap at level 40.");
  return bits.join(" ");
}

$("list").addEventListener("click", e => toggle(e.target.closest(".card")));
$("list").addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === " "){ const c = e.target.closest(".card");
    if(c){ e.preventDefault(); toggle(c); } } });
function toggle(c){ if(!c) return;
  const open = c.classList.toggle("open");
  c.setAttribute("aria-expanded", open);
  const d = c.querySelector(".detail"); if(d) d.hidden = !open || !d.textContent.trim(); }

$("foot").innerHTML = `<b>Core</b> means top 25 in at least one role. <b>Flex</b> means top 75 in two or
  more. <b>Deep</b> is a single-role specialist. Ranks are the best any form in that family reaches,
  Shadow included, since they share a candy pool.<br><br>
  <b>Live now</b> shows what is obtainable today: event spawns, raid rotations, and egg pools.
  It does not cover the ordinary background spawns in your area \u2014 nobody publishes those.<br><br>
  Lure tags come from typing: a lure boosts those types out of your local pool, so it
  concentrates what is already around rather than summoning something new. Searching a
  lure name lists everything it helps with.<br><br>
  Built from PvPoke rankings, data dated ${DATA.gamemaster.slice(0,10)}. Generated ${DATA.generated}.`;

sync();
</script>
</body>
</html>
